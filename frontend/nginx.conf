server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;  # overwrite, never append: clients must not spoof their IP
    proxy_set_header X-Forwarded-Proto $scheme;
    # A cold analysis can take a while: the backend allows up to 3 upstream attempts of 30s each.
    proxy_read_timeout 120s;
  }

  # Hashed build assets can be cached for a long time; index.html must always be revalidated
  # so a rebuilt app is picked up (a stale cached index.html is what loads an old, broken bundle).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri /index.html;
  }
}
